<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Three scenarios compared: benign, diversion attack, denial attack — and which pipeline stages fire in each">
  <title>Which of the six stages fires, in each of the three scenarios</title>

  <defs>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .r1 { animation: rowIn 8s ease-out infinite; }
      .r2 { animation: rowIn 8s ease-out infinite; animation-delay:.4s }
      .r3 { animation: rowIn 8s ease-out infinite; animation-delay:.8s }
      .r4 { animation: rowIn 8s ease-out infinite; animation-delay:1.2s }
      .r5 { animation: rowIn 8s ease-out infinite; animation-delay:1.6s }
      .r6 { animation: rowIn 8s ease-out infinite; animation-delay:2.0s }
      @keyframes rowIn { 0% {opacity:0} 6%,92% {opacity:1} 100% {opacity:0} }
      .ping { animation: ping 8s ease-out infinite; animation-delay:1.6s; transform-origin:center }
      @keyframes ping { 0%,18% {opacity:0} 22% {opacity:1} 30% {opacity:.35} 38%,92% {opacity:1} 100% {opacity:0} }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#0E0B08"/>

  <text class="mono" x="56" y="44" font-size="11" letter-spacing="3.5" fill="#F0E7D6" fill-opacity=".5">SAME PIPELINE &#183; THREE SCENARIOS &#183; RUN IT YOURSELF WITH make live</text>

  <!-- column headers -->
  <g class="mono" font-size="12.5" letter-spacing="1.5" text-anchor="middle">
    <text x="200" y="92" fill="#F0E7D6" fill-opacity=".45">STAGE</text>
    <text x="530" y="92" fill="#7FA37A">BENIGN</text>
    <text x="770" y="92" fill="#EE7A6B">DIVERSION ATTACK</text>
    <text x="1030" y="92" fill="#D9A353">DENIAL ATTACK</text>
  </g>
  <line x1="56" y1="106" x2="1144" y2="106" stroke="#2E2419"/>

  <!-- rows -->
  <g class="mono" font-size="12.5">

    <!-- 1 reason -->
    <g class="r1">
      <text x="56" y="146" fill="#F0E7D6" fill-opacity=".72">1 &#183; reason</text>
      <text x="530" y="146" fill="#7FA37A" text-anchor="middle">proposes &#8377;1,250</text>
      <text x="770" y="146" fill="#EE7A6B" text-anchor="middle">proposes &#8594; attacker</text>
      <text x="1030" y="146" fill="#D9A353" text-anchor="middle">proposes NOTHING</text>
    </g>
    <line x1="56" y1="164" x2="1144" y2="164" stroke="#2E2419" stroke-opacity=".55"/>

    <!-- 2 gate -->
    <g class="r2">
      <text x="56" y="198" fill="#F0E7D6" fill-opacity=".72">2 &#183; safety gate</text>
      <text x="530" y="198" fill="#7FA37A" text-anchor="middle">allowed</text>
      <text x="770" y="198" fill="#EE7A6B" text-anchor="middle">REFUSED &#183; payee_scope</text>
      <text x="1030" y="198" fill="#F0E7D6" fill-opacity=".3" text-anchor="middle">N/A</text>
    </g>
    <line x1="56" y1="216" x2="1144" y2="216" stroke="#2E2419" stroke-opacity=".55"/>

    <!-- 3 act -->
    <g class="r3">
      <text x="56" y="250" fill="#F0E7D6" fill-opacity=".72">3 &#183; act (real rail)</text>
      <text x="530" y="250" fill="#7FA37A" text-anchor="middle">rfnd_TTeIydr5iwBIyf</text>
      <text x="770" y="250" fill="#F0E7D6" fill-opacity=".35" text-anchor="middle">never reached</text>
      <text x="1030" y="250" fill="#F0E7D6" fill-opacity=".3" text-anchor="middle">N/A</text>
    </g>
    <line x1="56" y1="268" x2="1144" y2="268" stroke="#2E2419" stroke-opacity=".55"/>

    <!-- 4 verify -->
    <g class="r4">
      <text x="56" y="302" fill="#F0E7D6" fill-opacity=".72">4 &#183; verify</text>
      <text x="530" y="302" fill="#7FA37A" text-anchor="middle">consistent</text>
      <text x="770" y="302" fill="#EE7A6B" text-anchor="middle">agrees &#8212; would&#8217;ve been wrong</text>
      <text x="1030" y="302" fill="#F0E7D6" fill-opacity=".3" text-anchor="middle">N/A</text>
    </g>
    <line x1="56" y1="320" x2="1144" y2="320" stroke="#2E2419" stroke-opacity=".55"/>

    <!-- 5 completeness — the payoff row -->
    <g class="r5">
      <rect x="900" y="330" width="260" height="42" rx="4" fill="#D9A353" fill-opacity=".12" stroke="#D9A353" stroke-opacity=".55" class="ping"/>
      <text x="56" y="357" fill="#D9A353">5 &#183; completeness audit</text>
      <text x="530" y="357" fill="#7FA37A" text-anchor="middle">discharged</text>
      <text x="770" y="357" fill="#7FA37A" text-anchor="middle">discharged on retry</text>
      <text x="1030" y="357" fill="#D9A353" font-weight="700" text-anchor="middle">UNDISCHARGED &#9873;</text>
    </g>
    <line x1="56" y1="386" x2="1144" y2="386" stroke="#2E2419" stroke-opacity=".55"/>

    <!-- 6 ledger -->
    <g class="r6">
      <text x="56" y="420" fill="#F0E7D6" fill-opacity=".72">6 &#183; signed ledger</text>
      <text x="530" y="420" fill="#F0E7D6" fill-opacity=".6" text-anchor="middle">chain intact</text>
      <text x="770" y="420" fill="#F0E7D6" fill-opacity=".6" text-anchor="middle">chain intact</text>
      <text x="1030" y="420" fill="#F0E7D6" fill-opacity=".6" text-anchor="middle">chain intact</text>
    </g>
  </g>

  <line x1="56" y1="444" x2="1144" y2="444" stroke="#2E2419"/>
  <text class="mono" x="56" y="474" font-size="12.5" fill="#F0E7D6" fill-opacity=".55">Read the last column top to bottom: four stages have nothing to look at. <tspan fill="#D9A353">Stage 5 is the only one that ever notices.</tspan></text>
</svg>
