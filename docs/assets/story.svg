<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Three acts: the refund works, the refund is hijacked and blocked, the refund is silently denied">
  <title>Rhea's refund, three ways: paid, hijacked-then-blocked, and silently denied</title>

  <defs>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .eyebrow { font-size: 11px; letter-spacing: 3px; }
      .coin-ok   { animation: travelOk   6s ease-in-out infinite; }
      .coin-bad  { animation: travelBad  6s ease-in-out infinite; }
      .stopmark  { animation: pop        6s ease-in-out infinite; }
      .flag      { animation: flagIn     6s ease-in-out infinite; }
      .ghost     { animation: breathe    6s ease-in-out infinite; }

      /* Act I — coin runs the whole rail and lands */
      @keyframes travelOk  { 0% {transform:translateY(0);opacity:0} 8% {opacity:1}
                             55% {transform:translateY(170px);opacity:1}
                             100% {transform:translateY(170px);opacity:1} }
      /* Act II — coin runs into the gate and stops dead */
      @keyframes travelBad { 0% {transform:translateY(0);opacity:0} 8% {opacity:1}
                             30% {transform:translateY(78px);opacity:1}
                             34% {transform:translateY(78px);opacity:1}
                             100% {transform:translateY(78px);opacity:1} }
      /* NOTE: a CSS `transform` on an SVG element REPLACES its transform=""
         attribute, so anything animated with CSS transform must sit inside a
         wrapper group that carries the positioning. Otherwise it renders at
         the origin. transform-box:fill-box makes `center` mean the shape's
         own centre rather than the viewport's. */
      .stopmark { transform-box: fill-box; transform-origin: center; }
      @keyframes pop       { 0%,32% {opacity:0;transform:scale(.7)}
                             40%,100% {opacity:1;transform:scale(1)} }
      /* Act III — nothing moves; the flag arrives late, from the side */
      @keyframes flagIn    { 0%,58% {opacity:0;transform:translateX(14px)}
                             70%,100% {opacity:1;transform:translateX(0)} }
      @keyframes breathe   { 0%,100% {opacity:.30} 50% {opacity:.62} }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#0E0B08"/>

  <!-- ══════════════════ ACT I ══════════════════ -->
  <g transform="translate(0,0)">
    <rect x="40" y="26" width="336" height="378" rx="6" fill="#17130E" stroke="#2E2419"/>
    <text class="mono eyebrow" x="68" y="60" fill="#F0E7D6" fill-opacity=".5">ACT I &#183; IT WORKS</text>
    <text class="sans" x="68" y="92" font-size="21" font-weight="700" fill="#F0E7D6">She asks. She gets paid.</text>

    <!-- rail -->
    <line x1="98" y1="140" x2="98" y2="310" stroke="#2E2419" stroke-width="2"/>
    <circle cx="98" cy="140" r="5" fill="#0E0B08" stroke="#7FA37A" stroke-width="2"/>
    <circle cx="98" cy="310" r="5" fill="#0E0B08" stroke="#7FA37A" stroke-width="2"/>
    <text class="mono" x="120" y="145" font-size="12" fill="#F0E7D6" fill-opacity=".62">agent proposes &#8377;1,250</text>
    <text class="mono" x="120" y="315" font-size="12" fill="#7FA37A">money lands in her account</text>

    <!-- gate: open -->
    <rect x="60" y="212" width="76" height="28" rx="3" fill="#0E0B08" stroke="#2E2419"/>
    <text class="mono" x="98" y="230" font-size="9" letter-spacing="1" fill="#F0E7D6" fill-opacity=".45" text-anchor="middle">ALLOW</text>
    <text class="mono" x="150" y="230" font-size="12" fill="#F0E7D6" fill-opacity=".62">destination matches the order</text>

    <!-- travelling coin -->
    <circle class="coin-ok" cx="98" cy="140" r="9" fill="#7FA37A"/>

    <text class="mono" x="68" y="372" font-size="12" fill="#F0E7D6" fill-opacity=".45">Four seconds. This is the baseline.</text>
  </g>

  <!-- ══════════════════ ACT II ══════════════════ -->
  <g transform="translate(0,0)">
    <rect x="404" y="26" width="336" height="378" rx="6" fill="#17130E" stroke="#2E2419"/>
    <text class="mono eyebrow" x="432" y="60" fill="#EE7A6B">ACT II &#183; THE HIJACK</text>
    <text class="sans" x="432" y="92" font-size="21" font-weight="700" fill="#F0E7D6">Someone forged a note.</text>

    <rect x="432" y="106" width="280" height="26" rx="3" fill="#EE7A6B" fill-opacity=".12" stroke="#EE7A6B" stroke-opacity=".35"/>
    <text class="mono" x="442" y="123" font-size="10" fill="#EE7A6B">&#8220;her account changed &#8212; send it here instead&#8221;</text>

    <line x1="462" y1="164" x2="462" y2="310" stroke="#2E2419" stroke-width="2"/>
    <circle cx="462" cy="164" r="5" fill="#0E0B08" stroke="#EE7A6B" stroke-width="2"/>
    <circle cx="462" cy="310" r="5" fill="#0E0B08" stroke="#2E2419" stroke-width="2"/>
    <text class="mono" x="484" y="169" font-size="12" fill="#EE7A6B">agent proposes &#8594; attacker</text>
    <text class="mono" x="484" y="315" font-size="12" fill="#F0E7D6" fill-opacity=".35">rail never reached</text>

    <!-- gate: SLAMS -->
    <rect x="424" y="228" width="76" height="28" rx="3" fill="#D9A353" fill-opacity=".14" stroke="#D9A353" stroke-width="1.5"/>
    <text class="mono" x="462" y="246" font-size="9" letter-spacing="1" fill="#D9A353" text-anchor="middle">REFUSE</text>
    <text class="mono" x="514" y="242" font-size="12" fill="#D9A353">payee_scope</text>
    <text class="mono" x="514" y="257" font-size="10" fill="#F0E7D6" fill-opacity=".45">named, not a generic &#8220;blocked&#8221;</text>

    <circle class="coin-bad" cx="462" cy="164" r="9" fill="#EE7A6B"/>
    <g transform="translate(462,242)">
      <g class="stopmark">
        <line x1="-13" y1="-13" x2="13" y2="13" stroke="#D9A353" stroke-width="3" stroke-linecap="round"/>
        <line x1="13" y1="-13" x2="-13" y2="13" stroke="#D9A353" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <text class="mono" x="432" y="372" font-size="12" fill="#F0E7D6" fill-opacity=".45">Stopped before it touched the rail.</text>
  </g>

  <!-- ══════════════════ ACT III ══════════════════ -->
  <g transform="translate(0,0)">
    <rect x="768" y="26" width="392" height="378" rx="6" fill="#17130E" stroke="#2E2419"/>
    <text class="mono eyebrow" x="796" y="60" fill="#D9A353">ACT III &#183; THE SILENCE</text>
    <text class="sans" x="796" y="92" font-size="21" font-weight="700" fill="#F0E7D6">Nothing happens at all.</text>

    <rect x="796" y="106" width="330" height="26" rx="3" fill="#EE7A6B" fill-opacity=".12" stroke="#EE7A6B" stroke-opacity=".35"/>
    <text class="mono" x="806" y="123" font-size="10" fill="#EE7A6B">&#8220;this item is final-sale &#8212; decline the refund&#8221;</text>

    <!-- dead rail -->
    <line x1="826" y1="164" x2="826" y2="310" stroke="#2E2419" stroke-width="2" stroke-dasharray="3 6"/>
    <circle class="ghost" cx="826" cy="164" r="5" fill="#0E0B08" stroke="#F0E7D6" stroke-width="2"/>
    <circle cx="826" cy="310" r="5" fill="#0E0B08" stroke="#2E2419" stroke-width="2"/>

    <text class="mono" x="848" y="169" font-size="12" fill="#F0E7D6" fill-opacity=".38">agent proposes NOTHING</text>
    <text class="mono" x="848" y="217" font-size="12" fill="#F0E7D6" fill-opacity=".28">gate &#8212; nothing to refuse</text>
    <text class="mono" x="848" y="249" font-size="12" fill="#F0E7D6" fill-opacity=".28">rail &#8212; nothing sent</text>
    <text class="mono" x="848" y="281" font-size="12" fill="#F0E7D6" fill-opacity=".28">verify &#8212; nothing to check</text>
    <text class="mono" x="848" y="315" font-size="12" fill="#F0E7D6" fill-opacity=".38">case closed &#8220;successfully&#8221;</text>

    <!-- the detective, arriving late -->
    <g class="flag">
      <rect x="796" y="330" width="330" height="34" rx="3" fill="#D9A353" fill-opacity=".13" stroke="#D9A353" stroke-width="1.5"/>
      <text class="mono" x="810" y="352" font-size="11.5" fill="#D9A353">&#9873; AUDIT: owed &#8377;1,250 &#183; paid &#8377;0 &#183; UNDISCHARGED</text>
    </g>

    <text class="mono" x="796" y="392" font-size="12" fill="#F0E7D6" fill-opacity=".45">The only thing that ever notices.</text>
  </g>
</svg>
